<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>Countdown Timer</title>
  <style>
    body {
      margin: 0;
      background: black;
      color: white;
      font-family: monospace;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .title {
      font-size: 6vw; /* 画面幅の6% */
      color: #aaa;
      margin-bottom: 2vh;
      white-space: nowrap;
    }

    .timer {
      font-size: 25vw; /* 画面幅の25% → 自動縮小 */
      font-weight: bold;
      line-height: 1;
      white-space: nowrap;
    }

    /* タブレット・PC向けに最大サイズを制限 */
    @media (min-width: 800px) {
      .title {
        font-size: 40px;
      }
      .timer {
        font-size: 200px;
      }
    }
  </style>
</head>
<body>

<div>
  <div class="title">冬休み終了まで残り：</div>
  <div id="display" class="timer">00:00:00</div>
</div>

<script>
const TARGET_TIME = new Date(Date.UTC(2026, 0, 7, 15, 0, 0));

function pad(n) {
  return String(Math.abs(n)).padStart(2, '0');
}

function update() {
  const now = new Date();
  let diffSec = Math.floor((TARGET_TIME - now) / 1000);

  const h = Math.floor(diffSec / 3600);
  const m = Math.floor((diffSec % 3600) / 60);
  const s = diffSec % 60;

  document.getElementById('display').textContent =
    `${pad(h)}:${pad(m)}:${pad(s)}`;
}

update();
setInterval(update, 1000);
</script>

</body>
</html>
